<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talk to my voice bot</title>
<style>
  :root {
    --bg: #eef2f7; --surface: #ffffff; --ink: #14213d; --muted: #5b6b85;
    --accent: #2b50e6; --accent-soft: #dbe4ff; --line: #d5ddea; --me: #e8edf9;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1626; --surface: #172036; --ink: #eaf0ff; --muted: #9aa9c6;
            --accent: #6f8cff; --accent-soft: #24335f; --line: #2a3857; --me: #1f2c4d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 17px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 28px 18px 40px; display: flex; flex-direction: column; gap: 22px; }
  h1 { margin: 0; font-size: 1.7rem; line-height: 1.2; }
  .sub { margin: 6px 0 0; color: var(--muted); }

  .stage { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 8px 0; }
  .mic { position: relative; width: 112px; height: 112px; border-radius: 50%; border: 0; cursor: pointer;
         background: var(--accent); color: #fff; display: grid; place-items: center; }
  .mic svg { width: 44px; height: 44px; }
  .mic:focus-visible, .chip:focus-visible, button.send:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .mic::before { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 3px solid var(--accent); opacity: 0; }
  .mic.listening::before { animation: pulse 1.3s ease-out infinite; }
  .mic.speaking { background: var(--ink); }
  .mic.thinking { opacity: .7; cursor: progress; }
  @keyframes pulse { from { transform: scale(.9); opacity: .8; } to { transform: scale(1.35); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .mic.listening::before { animation: none; opacity: .6; } }
  #status { min-height: 1.5em; color: var(--muted); font-weight: 600; text-align: center; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px;
          padding: 9px 14px; font: inherit; font-size: .92rem; cursor: pointer; }
  .chip:hover { background: var(--accent-soft); }

  #log { display: flex; flex-direction: column; gap: 10px; }
  .msg { padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
  .msg.user { background: var(--me); align-self: flex-end; max-width: 88%; }
  .msg .who { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 2px; }

  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; padding: 12px 14px; font: inherit; border-radius: 12px;
          border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
  button.send { padding: 0 18px; border: 0; border-radius: 12px; background: var(--ink); color: var(--bg); font: inherit; font-weight: 600; cursor: pointer; }
  .note { color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Ask me anything about me</h1>
    <p class="sub">Tap the microphone and ask a question out loud, or pick one below.</p>
  </header>

  <section class="stage" aria-label="Voice controls">
    <button id="mic" class="mic" aria-label="Start talking">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 1 0-8 0v5a4 4 0 0 0 4 4Zm6-4a1 1 0 1 1 2 0 8 8 0 0 1-7 7.94V21h3a1 1 0 1 1 0 2H8a1 1 0 1 1 0-2h3v-2.06A8 8 0 0 1 4 11a1 1 0 1 1 2 0 6 6 0 0 0 12 0Z"/></svg>
    </button>
    <div id="status" role="status" aria-live="polite">Tap the mic to start</div>
  </section>

  <section class="chips" id="chips" aria-label="Sample questions"></section>
  <section id="log" aria-live="polite"></section>

  <form id="form">
    <input id="text" type="text" placeholder="Or type your question here" autocomplete="off" aria-label="Type your question">
    <button class="send" type="submit">Send</button>
  </form>
  <p class="note" id="note"></p>
</main>

<script>
const QUESTIONS = [
  "What should we know about your life story in a few sentences?",
  "What's your #1 superpower?",
  "What are the top 3 areas you'd like to grow in?",
  "What misconception do your coworkers have about you?",
  "How do you push your boundaries and limits?"
];

const $ = (id) => document.getElementById(id);
const mic = $("mic"), statusEl = $("status"), log = $("log");
let history = [];
let busy = false;
let recognition = null;
let state = "idle"; // idle | listening | thinking | speaking

function setState(s, text) {
  state = s;
  mic.className = "mic " + (s === "idle" ? "" : s);
  statusEl.textContent = text || ({
    idle: "Tap the mic to start", listening: "Listening… ask your question",
    thinking: "Thinking…", speaking: "Speaking… tap the mic to stop"
  })[s];
  mic.setAttribute("aria-label", s === "listening" ? "Stop listening" : s === "speaking" ? "Stop speaking" : "Start talking");
}

function addMsg(role, text) {
  const d = document.createElement("div");
  d.className = "msg " + role;
  const who = document.createElement("span");
  who.className = "who"; who.textContent = role === "user" ? "You" : "Me";
  const p = document.createElement("span"); p.textContent = text;
  d.append(who, p); log.append(d);
  d.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

// ---------- Text to speech ----------
function pickVoice() {
  const voices = speechSynthesis.getVoices();
  return voices.find(v => v.lang === "en-IN") || voices.find(v => v.lang.startsWith("en-") && /google|natural|samantha/i.test(v.name))
      || voices.find(v => v.lang.startsWith("en")) || null;
}
function speak(text) {
  if (!("speechSynthesis" in window)) { setState("idle"); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice(); if (v) { u.voice = v; u.lang = v.lang; } else u.lang = "en-US";
  u.rate = 1;
  u.onstart = () => setState("speaking");
  u.onend = u.onerror = () => setState("idle");
  speechSynthesis.speak(u);
}
if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = () => {};

// ---------- Ask the bot ----------
async function ask(question) {
  question = question.trim();
  if (!question || busy) return;
  busy = true;
  speechSynthesis.cancel();
  addMsg("user", question);
  history.push({ role: "user", content: question });
  setState("thinking");
  try {
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "Request failed");
    history.push({ role: "assistant", content: data.reply });
    addMsg("bot", data.reply);
    speak(data.reply);
  } catch (e) {
    history.pop();
    addMsg("bot", e.message || "Something went wrong. Please try again.");
    setState("idle", "Something went wrong. Tap the mic to retry");
  } finally { busy = false; }
}

// ---------- Speech to text ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) {
  $("note").textContent = "Voice input isn't supported in this browser. Use Chrome, Edge or Safari, or type your question above. Answers will still be read aloud.";
} else {
  recognition = new SR();
  recognition.lang = "en-IN";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
  let heard = false;
  recognition.onresult = (e) => { heard = true; ask(e.results[0][0].transcript); };
  recognition.onerror = (e) => {
    heard = true;
    if (e.error === "not-allowed" || e.error === "service-not-allowed")
      setState("idle", "Microphone is blocked. Allow it in your browser settings, or type below.");
    else if (e.error === "no-speech") setState("idle", "I didn't hear anything. Tap the mic and try again.");
    else setState("idle", "Couldn't hear you. Tap the mic and try again.");
  };
  recognition.onend = () => { if (state === "listening" && !heard) setState("idle"); };
  recognition._reset = () => { heard = false; };
}

mic.addEventListener("click", () => {
  if (state === "speaking") { speechSynthesis.cancel(); setState("idle"); return; }
  if (state === "thinking") return;
  if (!recognition) { $("text").focus(); return; }
  if (state === "listening") { recognition.stop(); return; }
  // Unlock speech playback on iOS/Safari inside the tap
  if ("speechSynthesis" in window) speechSynthesis.speak(new SpeechSynthesisUtterance(""));
  recognition._reset();
  try { recognition.start(); setState("listening"); } catch (e) { /* already started */ }
});

// ---------- Chips and text form ----------
QUESTIONS.forEach(q => {
  const b = document.createElement("button");
  b.className = "chip"; b.type = "button"; b.textContent = q;
  b.addEventListener("click", () => ask(q));
  $("chips").append(b);
});
$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const v = $("text").value; $("text").value = "";
  ask(v);
});
</script>
</body>
</html>
