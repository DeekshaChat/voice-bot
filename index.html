<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Talk to my voice bot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0a2a33; --bg2:#06191f; --ink:#e9f7f5; --muted:#8fb3b8; --mint:#7ef0d4; --sky:#5aa9ff; --amber:#ffc857; --line:#1f4650; --card:#0f3641; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { min-height: 100vh; color: var(--ink); background: radial-gradient(ellipse at 50% 0%, var(--bg) 0%, var(--bg2) 70%) fixed;
         font: 17px/1.55 "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  main { max-width: 720px; margin: 0 auto; padding: 36px 20px 48px; display: flex; flex-direction: column; align-items: center; gap: 26px; text-align: center; }
  h1 { margin: 0; font-size: clamp(2rem, 7vw, 3.1rem); line-height: 1.05; font-weight: 800; letter-spacing: -.02em; }
  .sub { margin: 10px auto 0; max-width: 34em; color: var(--muted); }

  .orb-wrap { position: relative; width: 190px; height: 190px; display: grid; place-items: center; }
  .orb { position: relative; z-index: 2; width: 140px; height: 140px; border-radius: 50%; border: 0; cursor: pointer; color: #04222a;
         background: radial-gradient(circle at 32% 28%, #d9fff4 0%, var(--mint) 38%, var(--sky) 100%);
         box-shadow: 0 0 60px rgba(126,240,212,.35), inset 0 -10px 24px rgba(10,60,120,.35);
         display: grid; place-items: center; animation: breathe 4s ease-in-out infinite; transition: transform .2s; }
  .orb svg { width: 46px; height: 46px; }
  .orb:active { transform: scale(.95); }
  .orb:focus-visible, .chip:focus-visible, .send:focus-visible, input:focus-visible { outline: 3px solid var(--amber); outline-offset: 4px; }
  .ring { position: absolute; inset: 20px; border-radius: 50%; border: 2px solid var(--mint); opacity: 0; }
  .listening .ring { animation: ripple 1.8s ease-out infinite; }
  .listening .ring:nth-child(2) { animation-delay: .6s; } .listening .ring:nth-child(3) { animation-delay: 1.2s; }
  .speaking .orb { animation: talk .55s ease-in-out infinite alternate; background: radial-gradient(circle at 32% 28%, #fff3cf 0%, var(--amber) 40%, #ff9f6b 100%); box-shadow: 0 0 70px rgba(255,200,87,.4); }
  .thinking .orb { animation: none; opacity: .85; }
  .thinking .orb-wrap::after { content: ""; position: absolute; inset: 6px; border-radius: 50%; border: 3px solid transparent; border-top-color: var(--mint); animation: spin .9s linear infinite; }
  @keyframes breathe { 50% { transform: scale(1.05); } }
  @keyframes ripple { from { transform: scale(.8); opacity: .8; } to { transform: scale(1.5); opacity: 0; } }
  @keyframes talk { from { transform: scale(.97); } to { transform: scale(1.1); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .orb, .ring, .orb-wrap::after { animation: none !important; } .listening .ring { opacity: .6; } }
  #status { margin-top: -8px; color: var(--mint); font-weight: 600; min-height: 1.6em; }

  /* Live answer */
  #answer { width: 100%; min-height: 7.5em; padding: 20px 22px; border: 1px solid var(--line); border-radius: 22px; background: var(--card);
            font-size: 1.12rem; line-height: 1.6; text-align: left; }
  #answer .q { display: block; color: var(--muted); font-size: .9rem; margin-bottom: 8px; }
  #answer.empty { color: var(--muted); display: grid; place-items: center; text-align: center; }

  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; }
  .chip { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 9px 15px; font: inherit; font-size: .92rem; cursor: pointer; transition: border-color .15s, background .15s; }
  .chip:hover { border-color: var(--amber); background: rgba(255,200,87,.08); }

  form { width: 100%; display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; padding: 13px 16px; font: inherit; color: var(--ink); background: var(--bg2); border: 1px solid var(--line); border-radius: 14px; }
  input::placeholder { color: var(--muted); }
  .send { padding: 0 20px; border: 0; border-radius: 14px; background: var(--amber); color: #2a1d00; font: inherit; font-weight: 700; cursor: pointer; }

  .built { width: 100%; border-top: 1px solid var(--line); padding-top: 22px; }
  .built p { margin: 0 0 10px; color: var(--muted); font-size: .9rem; }
  .stack { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .stack span { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; font-size: .85rem; }
  .note { color: var(--muted); font-size: .85rem; margin: 0; }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">Hi, I'm Deeksha.</h1>
    <p class="sub" id="tagline">Mobile engineer for 9+ years, now building with AI. Ask me anything, out loud.</p>
  </header>

  <div class="orb-wrap" id="wrap">
    <span class="ring"></span><span class="ring"></span><span class="ring"></span>
    <button id="mic" class="orb" aria-label="Start talking">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 1 0-8 0v5a4 4 0 0 0 4 4Zm6-4a1 1 0 1 1 2 0 8 8 0 0 1-7 7.94V21h3a1 1 0 1 1 0 2H8a1 1 0 1 1 0-2h3v-2.06A8 8 0 0 1 4 11a1 1 0 1 1 2 0 6 6 0 0 0 12 0Z"/></svg>
    </button>
  </div>
  <div id="status" role="status" aria-live="polite">Tap the orb and ask a question</div>

  <section id="answer" class="empty" aria-live="polite">My answers will appear here as I speak them.</section>

  <section class="chips" id="chips" aria-label="Sample questions"></section>

  <form id="form">
    <input id="text" type="text" placeholder="Prefer typing? Ask here" autocomplete="off" aria-label="Type your question">
    <button class="send" type="submit">Ask</button>
  </form>
  <p class="note" id="note"></p>

</main>

<script>
const MY_NAME = "Deeksha";
const TAGLINE = "Mobile engineer for 9+ years, now building with AI. Ask me anything, out loud.";
const QUESTIONS = [
  "What should we know about your life story in a few sentences?",
  "What's your #1 superpower?",
  "What are the top 3 areas you'd like to grow in?",
  "What misconception do your coworkers have about you?",
  "How do you push your boundaries and limits?"
];

const $ = (id) => document.getElementById(id);
const mic = $("mic"), wrap = $("wrap"), statusEl = $("status"), answer = $("answer");
$("title").textContent = "Hi, I'm " + MY_NAME + ".";
$("tagline").textContent = TAGLINE;
document.title = "Talk to " + MY_NAME + "'s voice bot";

let history = [], busy = false, recognition = null, state = "idle", typer = null;

function setState(s, text) {
  state = s;
  wrap.className = "orb-wrap " + (s === "idle" ? "" : s);
  statusEl.textContent = text || ({
    idle: "Tap the orb and ask a question", listening: "Listening… go ahead",
    thinking: "Thinking…", speaking: "Speaking… tap the orb to stop"
  })[s];
  mic.setAttribute("aria-label", s === "listening" ? "Stop listening" : s === "speaking" ? "Stop speaking" : "Start talking");
}

function showAnswer(q, a) {
  clearInterval(typer);
  answer.className = "";
  answer.innerHTML = "";
  const qe = document.createElement("span"); qe.className = "q"; qe.textContent = "You asked: " + q;
  const ae = document.createElement("span");
  answer.append(qe, ae);
  if (!a) return;
  // Typewriter, roughly in step with speech
  let i = 0;
  typer = setInterval(() => { ae.textContent = a.slice(0, ++i); if (i >= a.length) clearInterval(typer); }, 22);
}

function pickVoice() {
  const v = speechSynthesis.getVoices();
  return v.find(x => x.lang === "en-IN") || v.find(x => x.lang.startsWith("en") && /google|natural|samantha/i.test(x.name)) || v.find(x => x.lang.startsWith("en")) || null;
}
function speak(text) {
  if (!("speechSynthesis" in window)) { setState("idle"); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice(); if (v) { u.voice = v; u.lang = v.lang; } else u.lang = "en-US";
  u.onstart = () => setState("speaking");
  u.onend = u.onerror = () => setState("idle");
  speechSynthesis.speak(u);
}

async function ask(question) {
  question = question.trim();
  if (!question || busy) return;
  busy = true;
  speechSynthesis.cancel();
  history.push({ role: "user", content: question });
  showAnswer(question, "");
  setState("thinking");
  try {
    const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ messages: history }) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "Request failed");
    history.push({ role: "assistant", content: data.reply });
    showAnswer(question, data.reply);
    speak(data.reply);
  } catch (e) {
    history.pop();
    showAnswer(question, e.message || "Something went wrong. Please try again.");
    setState("idle", "Something went wrong. Tap the orb to retry");
  } finally { busy = false; }
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) {
  $("note").textContent = "Voice input isn't supported in this browser. Use Chrome, Edge or Safari, or type your question. Answers are still read aloud.";
} else {
  recognition = new SR();
  recognition.lang = "en-IN"; recognition.interimResults = false; recognition.maxAlternatives = 1;
  let heard = false;
  recognition.onresult = (e) => { heard = true; ask(e.results[0][0].transcript); };
  recognition.onerror = (e) => {
    heard = true;
    if (e.error === "not-allowed" || e.error === "service-not-allowed") setState("idle", "Microphone is blocked. Allow it in browser settings, or type below.");
    else if (e.error === "no-speech") setState("idle", "I didn't hear anything. Tap the orb and try again.");
    else setState("idle", "Couldn't hear you. Tap the orb and try again.");
  };
  recognition.onend = () => { if (state === "listening" && !heard) setState("idle"); };
  recognition._reset = () => { heard = false; };
}

mic.addEventListener("click", () => {
  if (state === "speaking") { speechSynthesis.cancel(); setState("idle"); return; }
  if (state === "thinking") return;
  if (!recognition) { $("text").focus(); return; }
  if (state === "listening") { recognition.stop(); return; }
  if ("speechSynthesis" in window) speechSynthesis.speak(new SpeechSynthesisUtterance(""));
  recognition._reset();
  try { recognition.start(); setState("listening"); } catch (e) {}
});

QUESTIONS.forEach(q => {
  const b = document.createElement("button");
  b.className = "chip"; b.type = "button"; b.textContent = q;
  b.addEventListener("click", () => ask(q));
  $("chips").append(b);
});
$("form").addEventListener("submit", (e) => { e.preventDefault(); const v = $("text").value; $("text").value = ""; ask(v); });
</script>
</body>
</html>
